<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <title>Helpish — Gbyrish</title>
  <style>
    :root{--brown:#8b6f4e;--brown-dark:#6b5637;--cream:#fdf8f3;--cream2:#f5ede4;--ink:#2c2c2c;--muted:#8a7f74;--line:#e8dfd5;--warn:#8a5a12;--warn-bg:#fff7ed}
    *{box-sizing:border-box}html,body{height:100%;margin:0}
    body{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink);background:linear-gradient(145deg,#f8efe5,#fdfaf7 48%,#eee2d4);overflow:hidden}
    button,input{font:inherit}button{cursor:pointer}.shell{height:100%;display:grid;grid-template-rows:auto auto minmax(0,1fr) auto}
    .topbar{display:flex;align-items:center;gap:.75rem;padding:.8rem 1rem;border-bottom:1px solid var(--line);background:rgba(253,248,243,.94);backdrop-filter:blur(14px)}
    .mark{width:2.35rem;height:2.35rem;border-radius:50%;display:grid;place-items:center;background:var(--brown);color:#fff;font-family:Georgia,serif;font-weight:700;box-shadow:0 8px 20px rgba(139,111,78,.28)}
    .brand{min-width:0}.brand h1{margin:0;font:600 1.05rem Georgia,serif}.brand p{margin:.12rem 0 0;color:var(--muted);font-size:.72rem}
    .top-actions{margin-left:auto;display:flex;gap:.45rem}.icon-btn,.reset-btn{border:1px solid var(--line);background:#fff;color:var(--muted);border-radius:.65rem;min-width:2.2rem;height:2.2rem;padding:0 .65rem;text-decoration:none;display:grid;place-items:center}.icon-btn:hover,.reset-btn:hover{background:var(--cream2);color:var(--brown)}
    .health{display:flex;align-items:center;gap:.55rem;padding:.58rem 1rem;border-bottom:1px solid var(--line);background:#fff8;font-size:.74rem;color:var(--muted)}
    .health-dot{width:.55rem;height:.55rem;border-radius:50%;background:#a8a29e;flex:0 0 auto}.health.ok .health-dot{background:#38a169}.health.bad .health-dot{background:#d97706}.health.loading .health-dot{animation:pulse 1s infinite}
    .health strong{color:var(--ink)}.health code{font-size:.68rem}.health button{margin-left:auto;border:0;background:transparent;color:var(--brown);font-weight:650;white-space:nowrap}
    @keyframes pulse{50%{opacity:.3;transform:scale(.8)}}
    .conversation{min-height:0;overflow-y:auto;padding:1.1rem max(1rem,calc((100vw - 850px)/2));display:flex;flex-direction:column;gap:.72rem;overscroll-behavior:contain;scrollbar-width:thin}
    .intro{margin:auto 0 1rem;max-width:680px;text-align:center}.intro .eyebrow{color:var(--brown);font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;font-weight:750}.intro h2{font:500 clamp(1.55rem,4vw,2.35rem)/1.15 Georgia,serif;margin:.45rem 0 .55rem}.intro p{margin:0 auto;color:var(--muted);font-size:.86rem;line-height:1.6}
    .msg{max-width:86%;padding:.68rem .9rem;border-radius:1rem;font-size:.86rem;line-height:1.58;white-space:pre-wrap;word-break:break-word;animation:rise .24s ease both}@keyframes rise{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
    .msg.bot{align-self:flex-start;background:var(--cream2);border-bottom-left-radius:.3rem}.msg.me{align-self:flex-end;background:var(--brown);color:#fff;border-bottom-right-radius:.3rem}.msg.note{align-self:stretch;max-width:100%;text-align:center;background:var(--warn-bg);color:var(--warn);border:1px solid #fde9ce;font-size:.77rem}
    .msg a{color:var(--brown);font-weight:650}.msg.me a{color:#fff}.rt-line{display:block}.rt-line+.rt-line{margin-top:.42rem}.rt-list{margin:.3rem 0 .3rem 1.05rem;padding:0}.rt-code{font-family:ui-monospace,monospace;background:rgba(139,111,78,.12);padding:.05rem .3rem;border-radius:.3rem}
    .turn{align-self:flex-start;width:min(100%,88%);display:flex;flex-direction:column;gap:.45rem}.turn .msg{max-width:100%;animation:none}.noanim,.noanim .msg{animation:none!important}
    .thinking,.toolcard{border:1px solid var(--line);border-radius:.75rem;overflow:hidden;background:rgba(255,255,255,.76);font-size:.76rem}.thinking{border-color:#d4c8ba;background:#faf6f1}
    .block-head{display:flex;align-items:center;gap:.4rem;padding:.46rem .68rem;cursor:pointer;user-select:none;color:#6b5f53}.block-head:hover{background:rgba(139,111,78,.06)}.chevron{font-size:.6rem;transition:transform .18s}.open>.block-head .chevron{transform:rotate(90deg)}
    .block-body{max-height:0;opacity:0;overflow:hidden;padding:0 .68rem;border-top:1px solid transparent;white-space:pre-wrap;word-break:break-word;color:#5c5147;transition:.25s}.open>.block-body{max-height:40rem;opacity:1;padding:.5rem .68rem .6rem;border-top-color:var(--line);overflow-y:auto}.tool-icon{width:1.1rem;height:1.1rem;border-radius:.3rem;background:var(--brown);color:#fff;display:grid;place-items:center;font-size:.52rem;font-weight:800}.tool-time{margin-left:auto;color:var(--muted);font-size:.66rem}.tool-err{color:#c0392b}
    .status{align-self:flex-start;display:flex;align-items:center;gap:.35rem;color:var(--muted);font-size:.74rem;padding:.1rem .2rem}.status i{width:.32rem;height:.32rem;border-radius:50%;background:var(--brown);opacity:.3;animation:bounce 1s infinite}.status i:nth-child(2){animation-delay:.16s}.status i:nth-child(3){animation-delay:.32s}@keyframes bounce{50%{opacity:1;transform:translateY(-2px)}}
    .composer{padding:.7rem max(1rem,calc((100vw - 850px)/2)) calc(.7rem + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:rgba(253,248,243,.96);backdrop-filter:blur(14px)}
    .chips{display:flex;gap:.4rem;overflow-x:auto;padding:0 0 .55rem;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}.chip{border:1px solid var(--line);background:#fff;color:#5c5147;border-radius:999px;padding:.38rem .72rem;font-size:.72rem;white-space:nowrap}.chip:hover{background:var(--cream2);color:var(--brown)}
    .image-row{display:none;align-items:center;gap:.4rem;padding:0 0 .5rem}.image-row img{max-height:44px;border-radius:.45rem;border:1px solid var(--line)}.image-row button{border:0;background:transparent;color:var(--muted);font-size:1.1rem}
    .input-row{display:flex;align-items:center;gap:.5rem}.input{flex:1;min-width:0;border:1px solid var(--line);border-radius:999px;padding:.7rem 1rem;background:#fff;color:var(--ink);outline:none}.input:focus{border-color:var(--brown);box-shadow:0 0 0 3px rgba(139,111,78,.1)}
    .image-btn{width:2.45rem;height:2.45rem;border:0;border-radius:50%;background:transparent;color:var(--muted);display:grid;place-items:center}.image-btn:hover{background:var(--cream2);color:var(--brown)}
    .send{width:2.65rem;height:2.65rem;border:0;border-radius:50%;background:var(--brown);color:#fff;display:grid;place-items:center;box-shadow:0 8px 18px rgba(139,111,78,.25)}.send:hover:not(:disabled){background:var(--brown-dark)}.send:disabled{opacity:.45;cursor:default}
    .retry{border:1px solid #e9c98f;background:#fff;color:var(--warn);border-radius:999px;padding:.22rem .6rem;margin-left:.45rem;font-size:.7rem}
    .footer-note{text-align:center;color:var(--muted);font-size:.65rem;margin-top:.45rem}.footer-note a{color:var(--brown)}
    @media(max-width:600px){.topbar{padding:.68rem .75rem}.health{padding:.5rem .75rem}.conversation{padding:.9rem .75rem}.composer{padding-left:.75rem;padding-right:.75rem}.brand p{display:none}.msg{max-width:92%}.turn{width:100%;max-width:100%}.health code{display:none}}
  </style>
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div class="mark" aria-hidden="true">H</div>
      <div class="brand"><h1>Helpish</h1><p>Gbyrish shopping helper · one-file deployment</p></div>
      <div class="top-actions">
        <button class="reset-btn" id="reset" type="button">New chat</button>
        <a class="icon-btn" href="https://gbyrish.github.io/#shopall" title="Open Gbyrish" aria-label="Open Gbyrish">↗</a>
      </div>
    </header>
    <div class="health loading" id="health" role="status">
      <span class="health-dot"></span><span id="healthText">Checking the Helpish service…</span>
      <button id="healthRefresh" type="button">Check again</button>
    </div>
    <section class="conversation" id="log" aria-live="polite"></section>
    <footer class="composer">
      <div class="chips" id="chips"></div>
      <div class="image-row" id="imageRow"><img id="imageThumb" alt="Selected image"><button id="removeImage" type="button" aria-label="Remove image">×</button></div>
      <form id="form" autocomplete="off">
        <div class="input-row">
          <button class="image-btn" id="imageButton" type="button" aria-label="Attach image">▧</button>
          <input id="file" type="file" accept="image/jpeg,image/png,image/webp" hidden>
          <input class="input" id="input" type="text" maxlength="2000" placeholder="Ask about a product, gift, offer or delivery" aria-label="Message Helpish">
          <button class="send" id="send" type="submit" aria-label="Send">➤</button>
        </div>
      </form>
      <div class="footer-note">For anything sensitive, contact the store on <a href="https://wa.me/923363611223" target="_blank" rel="noopener">WhatsApp</a>.</div>
    </footer>
  </main>
<script>
    'use strict';
    // DEPLOYMENT SETTING: this file calls the server-side Helpish API.
    // Never put OLLAMA_API_KEY in this HTML. Ollama's API does not permit direct
    // authenticated browser calls, and the deployed function keeps the key secret.
    const HELPISH_API_ORIGIN = 'https://gbyrish-github-io.vercel.app';
    const HELPISH_ENDPOINT = HELPISH_API_ORIGIN.replace(/\/+$/, '') + '/api/helpish';
    const STORE_URL = 'https://gbyrish.github.io/';
    const STORE_KEY = 'gbyrish_helpish_standalone_v1';
    const $ = (id) => document.getElementById(id);

    const state = {
      messages: [], summary: '', busy: false, lastFailedSend: null,
      pendingImage: null, liveTurn: null,
    };

    const escapeHtml = (value) => String(value ?? '').replace(/[&<>"']/g, (m) => ({
      '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;',
    }[m]));

    const TOOL_LABELS = {
      searchProducts:'Looking through the catalogue',
      getProductDetails:'Reading the product details',
      checkProductStock:'Checking availability',
      getCategories:'Checking the categories',
      getActiveSale:'Checking current deals',
      getPromoInformation:'Checking promo codes',
      getShippingInformation:'Checking delivery and fees',
      getAuthenticatedOrder:'Looking up your order',
      recommendGifts:'Shortlisting gift options',
    };
    const toolLabel = (name) => TOOL_LABELS[name] || String(name || 'Store lookup').replace(/_/g, ' ');
    const fmtTime = (ms) => {
      if(!ms) return '';
      const seconds = (ms / 1000).toFixed(1);
      return seconds < 60 ? `${seconds}s` : `${Math.floor(seconds / 60)}m ${seconds % 60}s`;
    };

    function renderRichText(raw){
      let text = escapeHtml(raw);
      text = text.replace(/`([^`]+)`/g, '<code class="rt-code">$1</code>');
      text = text.replace(/\*\*([^*]+?)\*\*/g, '<strong>$1</strong>');
      text = text.replace(/(^|[^*])\*([^*\n]+?)\*(?!\*)/g, '$1<em>$2</em>');
      const route = /#(shopall|jewelry|bouquets|giftbaskets|wallet|rings|deals|faq|track-order|profile|checkout)\b/g;
      text = text.replace(route, (match) => `<a href="${STORE_URL}${match}" target="_blank" rel="noopener">${match}</a>`);
      return text.split(/\n{2,}/).map((part) => {
        const lines = part.split('\n');
        if(lines.every((line) => /^\s*[-*]\s+/.test(line))){
          return `<ul class="rt-list">${lines.map((line) => `<li>${line.replace(/^\s*[-*]\s+/, '')}</li>`).join('')}</ul>`;
        }
        return lines.map(escapeLine => `<span class="rt-line">${escapeLine}</span>`).join('');
      }).join('');
    }

    function load(){
      try{
        const saved = JSON.parse(localStorage.getItem(STORE_KEY) || '{}');
        if(Array.isArray(saved.messages)) state.messages = saved.messages.slice(-40);
        if(typeof saved.summary === 'string') state.summary = saved.summary;
      }catch{ state.messages = []; }
      if(!state.messages.length){
        state.messages.push({ role:'assistant', content:'Hello. I can help you find something, check prices and stock, explain current offers, or answer delivery questions. What are you after?' });
      }
    }
    function save(){
      try{
        localStorage.setItem(STORE_KEY, JSON.stringify({
          messages: state.messages.filter((m) => m.role !== 'note').slice(-40),
          summary: state.summary,
        }));
      }catch{ /* storage is optional */ }
    }
    function reset(){
      state.messages = [{ role:'assistant', content:'New chat. What would you like to find?' }];
      state.summary = ''; state.lastFailedSend = null; state.pendingImage = null;
      $('imageRow').style.display = 'none'; save(); renderLog(); renderChips();
    }

    function turnHtml(turn, key){
      let html = '';
      if(turn.thinking){
        const id = 'hpth-' + key;
        html += `<div class="thinking ${turn.thinkingOpen ? 'open' : ''}" id="${escapeHtml(id)}">
          <div class="block-head" data-toggle="thinking" data-target="${escapeHtml(id)}"><span class="chevron">▶</span> Thinking</div>
          <div class="block-body">${escapeHtml(turn.thinking)}</div></div>`;
      }
      for(const tool of (turn.tools || [])){
        const id = key + '-' + tool.id;
        const body = tool.error
          ? `<span class="tool-err">Error: ${escapeHtml(tool.result || 'Lookup failed')}</span>`
          : escapeHtml(tool.result || 'Waiting for result…');
        html += `<div class="toolcard" id="hptc-${escapeHtml(id)}">
          <div class="block-head" data-toggle="tool" data-target="hptc-${escapeHtml(id)}">
            <span class="tool-icon">⚙</span><span>${escapeHtml(tool.label || toolLabel(tool.name))}</span>
            ${tool.done ? `<span class="tool-time">${fmtTime((tool.endTime || Date.now()) - tool.startTime)}</span>` : ''}
            <span class="chevron">▶</span>
          </div><div class="block-body">${tool.args && tool.args !== '{}' ? `<div style="color:#8a7f74;margin-bottom:.3rem">Args: ${escapeHtml(tool.args)}</div>` : ''}${body}</div></div>`;
      }
      if(turn.text) html += `<div class="msg bot">${renderRichText(turn.text)}</div>`;
      return html;
    }

    function renderLog(){
      const log = $('log');
      const userTurns = state.messages.filter((m) => m.role === 'user').length;
      const intro = userTurns ? '' : `<div class="intro"><div class="eyebrow">Gbyrish shopping help</div><h2>What can I help you find?</h2><p>Ask about real catalogue items, prices, stock, gifts, offers, promo codes, and delivery information.</p></div>`;
      log.innerHTML = intro + state.messages.map((message, index) => {
        if(message.role === 'note'){
          return `<div class="msg note">${escapeHtml(message.content)}${message.retryable ? '<button class="retry" data-retry type="button">Try again</button>' : ''}</div>`;
        }
        if(message.role === 'user') return `<div class="msg me">${renderRichText(message.content)}</div>`;
        if(message.thinking || (message.tools && message.tools.length)){
          return `<div class="turn noanim">${turnHtml({ text:message.content, thinking:message.thinking, tools:message.tools }, 'log' + index)}</div>`;
        }
        return `<div class="msg bot">${renderRichText(message.content)}</div>`;
      }).join('');
      log.querySelectorAll('[data-toggle]').forEach((button) => button.addEventListener('click', () => {
        $(button.dataset.target)?.classList.toggle('open');
      }));
      log.querySelector('[data-retry]')?.addEventListener('click', retry);
      log.scrollTop = log.scrollHeight;
    }

    function renderChips(){
      const box = $('chips');
      const asked = state.messages.some((m) => m.role === 'user');
      if(state.busy || asked){ box.innerHTML = ''; return; }
      const chips = ['Gift ideas under Rs. 1,500', 'What is on sale?', 'Any promo codes?', 'What are the delivery fees?'];
      box.innerHTML = chips.map((text) => `<button class="chip" data-chip="${escapeHtml(text)}" type="button">${escapeHtml(text)}</button>`).join('');
      box.querySelectorAll('[data-chip]').forEach((button) => button.addEventListener('click', () => send(button.dataset.chip)));
    }

    function setStatus(label){
      document.querySelector('.status')?.remove();
      if(!label) return;
      const status = document.createElement('div');
      status.className = 'status';
      status.innerHTML = '<i></i><i></i><i></i><span>' + escapeHtml(label) + '</span>';
      $('log').appendChild(status);
      $('log').scrollTop = $('log').scrollHeight;
    }
    function setBusy(busy){
      state.busy = busy;
      $('send').disabled = busy; $('input').disabled = busy; $('imageButton').disabled = busy;
      renderChips();
    }
    function send(text){
      text = String(text || '').trim();
      if(state.busy || (!text && !state.pendingImage)) return;
      const images = state.pendingImage ? [state.pendingImage] : [];
      state.pendingImage = null; $('imageRow').style.display = 'none';
      state.messages = state.messages.filter((m) => m.role !== 'note');
      state.messages.push({ role:'user', content:text, images });
      state.lastFailedSend = null; save(); renderLog(); renderChips(); stream(text, images);
    }
    function retry(){
      if(state.busy || !state.lastFailedSend) return;
      const text = state.lastFailedSend;
      state.messages = state.messages.filter((m) => m.role !== 'note');
      renderLog(); stream(text, []);
    }
    async function stream(text, images){
      setBusy(true); setStatus('Thinking'); state.lastFailedSend = null;
      const history = state.messages.filter((m) => m.role === 'user' || m.role === 'assistant').slice(0, -1).slice(-24);
      const live = { text:'', thinking:'', tools:[], thinkingOpen:false };
      state.liveTurn = live;
      let container = null;
      const ensureContainer = () => {
        if(container) return container;
        setStatus(''); container = document.createElement('div');
        container.className = 'turn'; $('log').appendChild(container); return container;
      };
      const renderLive = () => {
        ensureContainer().innerHTML = turnHtml(live, 'live');
        $('log').querySelectorAll('[data-toggle]').forEach((button) => button.addEventListener('click', () => {
          $(button.dataset.target)?.classList.toggle('open');
        }));
        $('log').scrollTop = $('log').scrollHeight;
      };
      let failure = null;
      try{
        const response = await fetch(`${HELPISH_ENDPOINT}?standalone=${Date.now()}`, {
          method:'POST', headers:{ 'Content-Type':'application/json' },
          body:JSON.stringify({
            mode:'chat', message:text || '[image]', history, summary:state.summary,
            idToken:'', context:{ route:'#helpish-standalone', cartCount:0 },
            ...(images.length ? { images } : {}),
          }),
        });
        if(!response.ok){
          let detail = `The Helpish service returned HTTP ${response.status}.`;
          try{ const payload = await response.json(); if(payload?.detail) detail = payload.detail; }catch{}
          const error = new Error(detail); error.code = `http_${response.status}`; throw error;
        }
        if(!response.body) throw new Error('The Helpish service returned no readable stream.');
        const reader = response.body.getReader();
        const decoder = new TextDecoder();
        let buffer = '';
        while(true){
          const { value, done } = await reader.read();
          if(done) break;
          buffer += decoder.decode(value, { stream:true });
          const lines = buffer.split('\n'); buffer = lines.pop() || '';
          for(const line of lines){
            const trimmed = line.trim();
            if(!trimmed.startsWith('data:')) continue;
            let event;
            try{ event = JSON.parse(trimmed.slice(5).trim()); }catch{ continue; }
            if(event.type === 'status'){
              if(!live.text && !live.tools.length) setStatus(event.label || 'Thinking');
            }else if(event.type === 'thinking'){
              live.thinking += event.delta || ''; live.thinkingOpen = true; renderLive();
            }else if(event.type === 'text'){
              live.text += event.delta || ''; renderLive();
            }else if(event.type === 'tool_call'){
              if(live.text && !live.thinking){ live.thinking = live.text; live.text = ''; }
              live.tools.push({
                id:event.id, name:event.name, label:event.label || toolLabel(event.name),
                args:event.args || '', result:null, error:false, startTime:Date.now(), done:false,
              });
              renderLive();
            }else if(event.type === 'tool_result'){
              const tool = live.tools.find((item) => item.id === event.id);
              if(tool){ tool.result = event.result; tool.error = !!event.error; tool.done = true; tool.endTime = Date.now(); }
              renderLive();
            }else if(event.type === 'done'){
              if(typeof event.summary === 'string') state.summary = event.summary;
            }else if(event.type === 'error'){
              failure = event;
            }
          }
        }
        setStatus('');
        for(const tool of live.tools){ if(!tool.done){ tool.done = true; tool.endTime = Date.now(); } }
        if(live.text.trim() || live.tools.length){
          state.messages.push({
            role:'assistant', content:live.text.trim(), thinking:live.thinking || '',
            tools:live.tools.length ? live.tools.map((tool) => ({ ...tool, done:true })) : undefined,
          });
        }
        if(failure){
          state.lastFailedSend = text;
          state.messages.push({ role:'note', content:failure.message, retryable:true, code:failure.code });
        }
        if(!live.text.trim() && !live.tools.length && !failure){
          state.lastFailedSend = text;
          state.messages.push({ role:'note', content:'I did not receive an answer just then. Please try again.', retryable:true });
        }
      }catch(error){
        console.error('Standalone Helpish request failed:', { endpoint:HELPISH_ENDPOINT, message:error?.message, stack:error?.stack });
        setStatus(''); state.lastFailedSend = text;
        const configCodes = new Set(['bad_key','no_key','plan_limit','model_missing']);
        const message = configCodes.has(error?.code)
          ? `Helpish is not configured correctly yet (${error.code}). ${error.message}`
          : 'I could not reach the Helpish service. Check this page is served from an approved origin and try again.';
        state.messages.push({ role:'note', content:message, retryable:true, code:error?.code || 'network' });
      }finally{
        if(container) container.remove();
        state.liveTurn = null; save(); renderLog(); setBusy(false); checkHealth();
      }
    }

    async function resizeImage(file, maxDim = 1024){
      return new Promise((resolve, reject) => {
        const image = new Image();
        image.onload = () => {
          let { width, height } = image;
          if(width > maxDim || height > maxDim){
            const ratio = Math.min(maxDim / width, maxDim / height);
            width = Math.round(width * ratio); height = Math.round(height * ratio);
          }
          const canvas = document.createElement('canvas'); canvas.width = width; canvas.height = height;
          canvas.getContext('2d').drawImage(image, 0, 0, width, height);
          const type = file.type || 'image/jpeg';
          resolve({ data:canvas.toDataURL(type, type === 'image/png' ? .85 : .8).split(',')[1], type });
        };
        image.onerror = () => reject(new Error('Could not read image'));
        image.src = URL.createObjectURL(file);
      });
    }
    async function attachImage(file){
      if(!file) return;
      if(!['image/jpeg','image/png','image/webp'].includes(file.type)){
        state.messages.push({ role:'note', content:'Unsupported image type. Use JPG, PNG, or WebP.' }); renderLog(); return;
      }
      if(file.size > 5 * 1024 * 1024){
        state.messages.push({ role:'note', content:'Image is too large. Use one under 5 MB.' }); renderLog(); return;
      }
      try{
        state.pendingImage = await resizeImage(file);
        $('imageThumb').src = `data:${state.pendingImage.type};base64,${state.pendingImage.data}`;
        $('imageRow').style.display = 'flex';
      }catch{
        state.messages.push({ role:'note', content:'Could not read that image. Try a different file.' }); renderLog();
      }
    }

    let healthTimer = null;
    async function checkHealth(){
      const health = $('health'); health.className = 'health loading';
      $('healthText').textContent = 'Checking the Helpish service…';
      try{
        const response = await fetch(`${HELPISH_ENDPOINT}?health=${Date.now()}`, { cache:'no-store' });
        const payload = await response.json();
        if(payload.ok){
          health.className = 'health ok';
          $('healthText').innerHTML = `<strong>Helpish is online.</strong> Live model: <code>${escapeHtml(payload.model || 'configured')}</code>`;
        }else{
          health.className = 'health bad';
          const fix = payload.fix ? ` ${escapeHtml(payload.fix)}` : '';
          $('healthText').innerHTML = `<strong>Configuration required:</strong> <code>${escapeHtml(payload.code || 'unavailable')}</code> — ${escapeHtml(payload.detail || 'The provider is unavailable.')}${fix}`;
        }
      }catch(error){
        health.className = 'health bad';
        $('healthText').textContent = 'The Helpish service could not be reached. Serve this file from an approved store origin and try again.';
      }finally{
        clearTimeout(healthTimer); healthTimer = setTimeout(checkHealth, 60_000);
      }
    }

    $('form').addEventListener('submit', (event) => {
      event.preventDefault();
      const input = $('input'); const text = input.value; input.value = ''; send(text);
    });
    $('reset').addEventListener('click', reset);
    $('healthRefresh').addEventListener('click', checkHealth);
    $('imageButton').addEventListener('click', () => $('file').click());
    $('file').addEventListener('change', (event) => attachImage(event.target.files?.[0]));
    $('removeImage').addEventListener('click', () => {
      state.pendingImage = null; $('file').value = ''; $('imageRow').style.display = 'none';
    });
    document.addEventListener('keydown', (event) => {
      if(event.key === 'Escape' && state.pendingImage) $('removeImage').click();
    });

    load(); renderLog(); renderChips(); checkHealth();

</script>
</body>
</html>
