<style>
  * { -webkit-tap-highlight-color: transparent; }
  html { scroll-behavior: smooth; }
  body { font-family:'Poppins',sans-serif; background:#FDF8F3; color:#2C2C2C; }
  h1,h2,h3,h4,.font-serif { font-family:'Playfair Display',serif; }
  .script { font-family:'Great Vibes',cursive; }
  ::-webkit-scrollbar { width:8px; height:8px; }
  ::-webkit-scrollbar-thumb { background:#D8C9B5; border-radius:10px; }
  ::-webkit-scrollbar-track { background:#F5EDE4; }
  .page { display:none; }
  .page.active { display:block; animation:fadeIn .35s ease; }
  @keyframes fadeIn { from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);} }
  .btn-primary { background:#8B6F4E; color:#fff; transition:.25s; }
  .btn-primary:hover { background:#6B5637; }
  .btn-accent { background:#E8A0BF; color:#fff; transition:.25s; }
  .btn-accent:hover { background:#D67FA3; }
  .card-hover { transition:.3s ease; }
  .card-hover:hover { transform:translateY(-6px); box-shadow:0 18px 40px -12px rgba(139,111,78,.25); }
  .prod-img { transition:transform .5s ease; }
  .card-hover:hover .prod-img { transform:scale(1.07); }
  .cart-drawer, .mobile-cart-drawer, .search-overlay, .mobile-menu { transition:transform .35s cubic-bezier(.4,0,.2,1); }
  .toast { animation: slideUp .3s ease, fadeOutToast .3s ease 2.7s forwards; }
  @keyframes slideUp { from{transform:translateY(20px); opacity:0;} to{transform:translateY(0); opacity:1;} }
  @keyframes fadeOutToast { to{opacity:0; transform:translateY(-10px);} }
  input:focus, textarea:focus, select:focus { outline:none; box-shadow:0 0 0 3px rgba(139,111,78,.15); border-color:#8B6F4E; }
  .star { cursor:pointer; user-select:none; }
  .skel { background:linear-gradient(90deg,#F5EDE4 25%,#EFE3D3 37%,#F5EDE4 63%); background-size:400% 100%; animation:skel 1.4s ease infinite; }
  @keyframes skel { 0%{background-position:100% 50%} 100%{background-position:0 50%} }
  .hide-scrollbar::-webkit-scrollbar{display:none;}
  .hide-scrollbar{-ms-overflow-style:none; scrollbar-width:none;}
  .navlink { position:relative; }
  .navlink::after{content:'';position:absolute;left:0;bottom:-4px;width:0;height:2px;background:#E8A0BF;transition:.25s;}
  .navlink:hover::after{width:100%;}
  .bnav-item.active { color:#8B6F4E; }
  .bnav-item.active svg { stroke:#8B6F4E; }
  /* ===== Responsive breakpoints ===== */
  @media (max-width:767px){
    body{padding-bottom:64px;}
    .product-grid{grid-template-columns:repeat(2,1fr) !important;gap:10px !important;}
    .product-grid .product-card{pborder-radius:12px;}
    .checkout-grid{grid-template-columns:1fr !important;gap:16px !important;}
    .admin-grid{grid-template-columns:1fr !important;}
    .admin-form{max-width:100% !important;margin:0 !important;}
    .cart-drawer{width:100% !important;max-width:100% !important;}
    .settings-layout{flex-direction:column !important;}
    .settings-layout .settings-preview{display:none !important;}
    .hero-title{font-size:1.75rem !important;}
    .section-title{font-size:1.25rem !important;}
    .banner-text{font-size:0.8rem !important;}
    .checkout-item{flex-direction:column !important;align-items:flex-start !important;}
    .checkout-item img{width:100% !important;height:auto !important;max-height:200px !important;object-fit:cover !important;}
    .modal-content{width:95vw !important;max-height:90vh !important;margin:2vh auto !important;}
    .category-tiles{grid-template-columns:repeat(3,1fr) !important;gap:8px !important;}
    .profile-orders{overflow-x:auto;}
    .order-row{min-width:600px;}
    .featured-grid{grid-template-columns:repeat(2,1fr) !important;}
    .discount-form-grid{grid-template-columns:1fr !important;}
  }
  @media (min-width:768px) and (max-width:1023px){
    .product-grid{grid-template-columns:repeat(3,1fr) !important;}
    .featured-grid{grid-template-columns:repeat(3,1fr) !important;}
    .category-tiles{grid-template-columns:repeat(4,1fr) !important;}
  }
  @media (min-width:1024px){
    .product-grid{grid-template-columns:repeat(4,1fr) !important;}
    .featured-grid{grid-template-columns:repeat(4,1fr) !important;}
  }
  @media (max-width:480px){
    .product-grid{grid-template-columns:repeat(2,1fr) !important;gap:8px !important;}
    .category-tiles{grid-template-columns:repeat(2,1fr) !important;}
    .hero-title{font-size:1.5rem !important;}
    .banner-text{font-size:0.75rem !important;}
    .checkout-summary{padding:12px !important;}
    .admin-form{padding:12px !important;}
  }
  /* Mobile menu */
  .mobile-menu { opacity:0; pointer-events:none; visibility:hidden; transition:opacity .28s ease, visibility .28s ease; }
  .mobile-menu.open { opacity:1; pointer-events:auto; visibility:visible; }
  .mobile-menu .mmenu-panel { transform:translateX(-100%); transition:transform .3s cubic-bezier(.4,0,.2,1); }
  .mobile-menu.open .mmenu-panel { transform:translateX(0); }
  .line-through-sale { text-decoration:line-through; opacity:.7; }
  .sale-countdown { font-variant-numeric:tabular-nums; }
</style>

function siteLogo(){ return State.settings.logoUrl || DEFAULT_LOGO_DATA_URL; }

function saveCart(){ localStorage.setItem('gbyrish_cart', JSON.stringify(State.cart)); }
function money(n){ return 'Rs. ' + Number(n||0).toLocaleString('en-PK', {maximumFractionDigits:0}); }
function escapeHtml(s){ return (s||'').toString().replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function toast(msg, type='ok'){
  const c = document.getElementById('toast-container');
  const el = document.createElement('div');
  el.className = 'toast px-5 py-3 rounded-xl shadow-lg text-sm font-medium text-white ' + (type==='ok' ? 'bg-primary' : 'bg-red-500');
  el.textContent = msg;
  c.appendChild(el);
  setTimeout(()=> el.remove(), 3000);
}
function genOrderId(){
  const n = 1000 + Math.floor(Math.random()*8999);
  return 'GYB-' + n + '-' + Date.now().toString().slice(-4);
}

/* ---------------- Auth ---------------- */
function computeIsAdmin(user){
  if(!user || !user.email) return false;
  const email = user.email.toLowerCase();
  return ADMIN_EMAILS.map(e=>e.toLowerCase()).includes(email) || State.dynamicAdmins.includes(email);
}
if(auth){
  onAuthStateChanged(auth, (user) => {
    State.user = user;
    State.isAdmin = computeIsAdmin(user);
    render();
  }, (err) => { firebaseError = err.message; render(); });
}
// Dynamic admins: lets an existing admin type an email into the Admin Access
// panel to grant admin rights, without editing code. Backed by a Firestore
// 'admins' collection (doc id = lowercased email). Firestore security rules
// must also trust this collection (see isAdmin() in the rules) for writes
// by newly-added admins to actually be allowed.
if(db){
  onSnapshot(collection(db, 'admins'), (snap)=>{
    State.dynamicAdmins = snap.docs.map(d=>d.id);
    State.isAdmin = computeIsAdmin(State.user);
    render();
  }, (err)=>{ console.error('admins listener error:', err); });
}

function requireFirebase(){
  if(!auth || !db){ toast('Firebase is not configured yet. Replace the placeholder apiKey in the code.','err'); return false; }
  return true;
}
function doGoogleLogin(){
  if(!requireFirebase()) return;
  signInWithPopup(auth, googleProvider).then(()=>{
    closeModal();
    toast('Welcome to Gbyrish!');
  }).catch(e=> toast(e.message,'err'));
}
function doEmailLogin(email, pass){
  if(!requireFirebase()) return;
  signInWithEmailAndPassword(auth, email, pass).then(()=>{
    closeModal(); toast('Signed in successfully');
  }).catch(e=> toast(e.message,'err'));
}
function doEmailSignup(name, email, pass){
  if(!requireFirebase()) return;
  createUserWithEmailAndPassword(auth, email, pass).then(async (cred)=>{
    await updateProfile(cred.user, { displayName: name });
    closeModal(); toast('Account created! Welcome.');
  }).catch(e=> toast(e.message,'err'));
}
function doLogout(){
  if(!auth) return;
  signOut(auth).then(()=>{ location.hash = '#home'; toast('Signed out'); });
}

/* ---------------- DB: Products ---------------- */
if(db){
  onSnapshot(collection(db, 'products'), (snap)=>{
    const obj = {};
    snap.forEach(d=>{ obj[d.id] = d.data(); });
    State.products = obj;
    cleanCart();
    render();

    if(snap.exists()) State.settings = { ...State.settings, ...snap.data() };
    render();
  }, (err)=>{ firebaseError = err.message; render(); });
}

async function fileToDataUrl(file){
  return new Promise((res,rej)=>{
    const r = new FileReader();
    r.onload = () => res(r.result);
    r.onerror = rej;
    r.readAsDataURL(file);
  });
}

// Resize + compress an image file before it ever gets turned into a data URL.
// This is the single biggest fix for uploads that "hang forever": phone
// photos are often 3-10MB, and uploading that as an uncompressed base64
// string can take a very long time (or effectively stall) on slower
// connections. Shrinking to a reasonable max dimension + JPEG quality
// makes uploads fast and reliable.
async function compressImage(file, maxDim=1600, quality=0.82){
  const dataUrl = await fileToDataUrl(file);
  return new Promise((resolve, reject)=>{
    const img = new Image();
    img.onload = () => {
      let { width, height } = img;
      if(width > maxDim || height > maxDim){
        if(width > height){ height = Math.round(height * (maxDim/width)); width = maxDim; }
        else { width = Math.round(width * (maxDim/height)); height = maxDim; }
      }
      const canvas = document.createElement('canvas');
      canvas.width = width; canvas.height = height;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, width, height);
      resolve(canvas.toDataURL('image/jpeg', quality));
    };
    img.onerror = () => resolve(dataUrl); // fall back to original if decoding fails
    img.src = dataUrl;
  });
}

// Wrap any promise with a hard timeout so a stalled network request can
// never leave the UI stuck on "Saving..." forever.
function withTimeout(promise, ms, label){
  return Promise.race([
    promise,
    new Promise((_,rej)=> setTimeout(()=> rej(new Error(`${label} timed out after ${Math.round(ms/1000)}s. Check your internet connection and that Firebase Storage is enabled.`)), ms))
  ]);
}

// Free image hosting: no Firebase Storage / no billing plan needed.
const CLOUDINARY_CLOUD_NAME = 'la8sqzux';
const CLOUDINARY_UPLOAD_PRESET = 'gybrish-products';

async function uploadToCloudinary(dataUrl, folder){
  const url = `https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/image/upload`;
  const form = new FormData();
  form.append('file', dataUrl);
  form.append('upload_preset', CLOUDINARY_UPLOAD_PRESET);
  if(folder) form.append('folder', folder);
  try{
    const res = await withTimeout(fetch(url, { method: 'POST', body: form }), 30000, 'Image upload');
    const json = await res.json();
    if(!res.ok || !json.secure_url){
      throw new Error(json.error?.message || 'Cloudinary upload failed');
    }
    return json.secure_url;
  }catch(err){
    console.error('Image upload failed:', err);
    throw new Error('Image upload failed (' + (err.message||err) + '). Double check your Cloudinary cloud name and upload preset are correct and the preset is set to "Unsigned".');
  }
}

    '#shopall': '#shop',

/* ---------------- Cart Logic ---------------- */
function cartQtyFor(id, excludeIdx=-1){
  return State.cart.reduce((sum,c,i)=> (c.id===id && i!==excludeIdx) ? sum + c.qty : sum, 0);
}
function addToCart(id, qty=1, opts={}){
  const p = State.products[id];
  if(!p){ toast('Product not found','err'); return; }
  const stock = Number(p.stock||0);
  if(stock<=0){ toast(p.name + ' is out of stock','err'); return; }
  const already = cartQtyFor(id);
  if(already + qty > stock){
    toast(`Only ${stock} unit(s) of ${p.name} available`, 'err');
    qty = Math.max(0, stock - already);
    if(qty<=0) return;
  }
  const existing = State.cart.find(c => c.id===id && JSON.stringify(c.opts||{})===JSON.stringify(opts));
  if(existing) existing.qty += qty;
  else State.cart.push({ id, qty, opts });
  saveCart();
  toast(p.name + ' added to cart');
  refreshCartUI();
}
function removeFromCart(idx){
  State.cart.splice(idx,1); saveCart(); refreshCartUI();
}
function updateQty(idx, delta){
  const c = State.cart[idx];
  const p = State.products[c.id];
  const stock = p ? Number(p.stock||0) : 999;
  const newQty = c.qty + delta;
  if(delta>0 && cartQtyFor(c.id, idx) + newQty > stock){
    toast(`Only ${stock} unit(s) available`, 'err');
    return;
  }
  c.qty = Math.max(1, newQty);
  saveCart(); refreshCartUI();
}
function refreshCartUI(){
  // Update just the cart drawer + header/bottom-nav badge counts in place,
  // instead of calling render() and rebuilding the entire page (which was
  // restarting the page fade-in animation and reloading every product image).
  refreshCartDrawer();
  document.querySelectorAll('.cart-badge').forEach(el=>{
    const n = cartCount();
    el.textContent = n;
    el.classList.toggle('hidden', n<=0);
  });
}
function cartHasOutOfStock(){
  return State.cart.some(c => {
    const p = State.products[c.id];
    return !p || Number(p.stock||0) <= 0 || cartQtyFor(c.id) > Number(p.stock||0);
  });
}
function cartTotals(){
  cleanCart();
  let itemTotal = 0;
  State.cart.forEach(c => {
    const p = State.products[c.id];
    if(p) itemTotal += effPrice(p) * c.qty;
  });
  const shipping = itemTotal > 0 ? (itemTotal >= 5000 ? 0 : 250) : 0;
  let couponDiscount = 0;
  if(State.appliedCoupon && State.coupons[State.appliedCoupon]){
    couponDiscount = Math.round(itemTotal * (State.coupons[State.appliedCoupon]/100));
  }
  const spendResult = calcSpendDiscount(State.cart);
  const spendDiscount = spendResult.amount;
  const totalDiscount = couponDiscount + spendDiscount;
  const subtotalAfterDiscounts = Math.max(0, itemTotal - totalDiscount);
  const tax = Math.round(subtotalAfterDiscounts * 0.0); // tax set to 0%
  const grand = Math.max(0, subtotalAfterDiscounts + shipping + tax);
  return { itemTotal, shipping, couponDiscount, spendDiscount, discount: totalDiscount, tax, grand, spendDiscountRule: spendResult.rule || null, spendDiscountRules: spendResult.rules || [] };
}
function cartCount(){ return State.cart.reduce((a,c)=>a+c.qty,0); }
function optsSummary(opts){
  if(!opts) return '';
  const parts = Object.entries(opts).filter(([k,v])=>v).map(([k,v])=>escapeHtml(String(v)));
  return parts.join(' &middot; ');
}

/* ---------------- Sale Event System ---------------- */
let _lastSaleState = null;
function saleConfig(){
  const def = { active:false, name:'', description:'', discount:0, startDate:'', startTime:'', endDate:'', endTime:'', showBanner:true, showCountdown:true, buttonText:'Shop Now', buttonLink:'#shopall' };
  return { ...def, ...(State.settings.sale||{}) };
}
function parseSaleTime(dateStr, timeStr){
  if(!dateStr) return 0;
  const d = dateStr.split('-').map(Number);
  const t = (timeStr||'00:00').split(':').map(Number);
  return new Date(d[0], (d[1]||1)-1, d[2]||1, t[0]||0, t[1]||0).getTime();
}
function saleStartMs(){ return parseSaleTime(saleConfig().startDate, saleConfig().startTime); }
function saleEndMs(){ return parseSaleTime(saleConfig().endDate, saleConfig().endTime); }
function saleState(){
  const c = saleConfig();
  if(!c.active) return 'off';
  const s = saleStartMs(), e = saleEndMs();
  if(!s || !e || e<=s) return 'off';
  const now = Date.now();
  if(now < s) return 'upcoming';
  if(now >= e) return 'expired';
  return 'active';
}
function salePercent(){ return saleState()==='active' ? Number(saleConfig().discount||0) : 0; }
function effPrice(p){
  const st = saleState();
  const base = Number(p.price||0);
  const itemDiscount = Number(p.discountPercent||0);
  // Per-product discount takes precedence, then global sale discount
  const discount = itemDiscount > 0 ? itemDiscount : (st==='active' ? Number(saleConfig().discount||0) : 0);
  if(discount > 0){
    return Math.round(base * (1 - discount/100));
  }
  return base;
}
function priceHtml(p, cls='text-primary font-semibold'){
  const orig = Number(p.price||0);
  const itemDiscount = Number(p.discountPercent||0);
  const st = saleState();
  const saleDiscount = st==='active' ? Number(saleConfig().discount||0) : 0;
  const hasDiscount = (isDeal(p) && dealHasOriginalPrice(p)) || itemDiscount > 0 || (saleDiscount > 0 && itemDiscount <= 0);
  if(hasDiscount){
    return `<span class="line-through-sale text-gray-400 text-xs mr-1.5">${money(orig)}</span><span class="${cls}">${money(effPrice(p))}</span>`;
  }
  return `<span class="${cls}">${money(orig)}</span>`;
}

/* ---------------- Deals ---------------- */
// A Deal is a normal product (same collection, same cart/checkout path) that
// simply lives in the "Deals" category and carries a few extra optional
// fields: originalPrice (the pre-bundle combined value), includedItems
// (array of bundled item names), badge (small promo label) and featured
// (whether it shows in the homepage "Featured Deals" strip). The product's
// existing `price` field IS the deal price, so cart/checkout automatically
// charge the deal price with no extra wiring.
function isDeal(p){ return p && p.category === 'Deals'; }
function dealHasOriginalPrice(p){ return Number(p.originalPrice||0) > Number(p.price||0); }
function dealSavings(p){ return dealHasOriginalPrice(p) ? (Number(p.originalPrice) - Number(p.price||0)) : 0; }
function dealDiscountPercent(p){
  if(!dealHasOriginalPrice(p)) return 0;
  return Math.round((dealSavings(p) / Number(p.originalPrice)) * 100);
}
function dealBadgeHtml(p){
  if(!isDeal(p) || !p.badge) return '';
  return `<span class="absolute top-2 left-2 bg-accentDark text-white text-[10px] font-semibold uppercase tracking-wide px-2 py-1 rounded-full shadow-sm">${escapeHtml(p.badge)}</span>`;
}
function dealIncludedItemsHtml(p, full){
  const items = Array.isArray(p.includedItems) ? p.includedItems.filter(Boolean) : [];
  if(!items.length) return '';
  if(full){
    return `
    <div class="mb-5 bg-cream2 rounded-xl p-4">
      <p class="text-sm font-medium mb-2">This Deal Includes</p>
      <ul class="text-sm text-gray-600 space-y-1 list-disc list-inside">
        ${items.map(it=>`<li>${escapeHtml(it)}</li>`).join('')}
      </ul>
    </div>`;
  }
  return `<p class="text-[11px] text-gray-500 mt-1 line-clamp-1">Includes: ${escapeHtml(items.join(' + '))}</p>`;
}
function remainingParts(targetMs){
  const ms = Math.max(0, targetMs - Date.now());
  const s = Math.floor(ms/1000);
  return { d: Math.floor(s/86400), h: Math.floor((s%86400)/3600), m: Math.floor((s%3600)/60), sec: s%60 };
}
function countdownText(){
  const st = saleState();
  const pad = n => String(n).padStart(2,'0');
  if(st==='active'){ const p=remainingParts(saleEndMs()); return `${p.d}d ${pad(p.h)}h ${pad(p.m)}m ${pad(p.sec)}s`; }
  if(st==='upcoming'){ const p=remainingParts(saleStartMs()); return `Starts in: ${p.d}d ${pad(p.h)}h ${pad(p.m)}m ${pad(p.sec)}s`; }
  return '';
}
function saleBanner(){

function cleanCart(){
  if(!State.products) return;
  let changed = false;
  State.cart = State.cart.filter(c => { const keep = !!State.products[c.id]; if(!keep) changed = true; return keep; });
  if(changed) saveCart();
}

/* ================================================================
   SPEND-THRESHOLD DISCOUNT SYSTEM
   Stored in Firestore: settings/site -> spendDiscountRules (array)
   Each rule:
   {
     id: string,
     name: string,
     minSpend: number (PKR),        — threshold to qualify
     discountAmount: number (PKR),  — flat discount applied
     scope: 'store' | 'category' | 'product',  — what counts toward threshold
     category: string | null,       — when scope === 'category'
     productIds: string[] | null,   — when scope === 'product'
     discountTarget: 'store' | 'category' | 'product',  — where discount applies
     discountCategory: string | null,  — when discountTarget === 'category'
     discountProductIds: string[] | null,  — when discountTarget === 'product'
     active: boolean,
     startDate: string | null,
     endDate: string | null,
     // stacking is a global setting in site settings, not per-rule
   }
   ================================================================ */

function spendDiscountRules(){
  const s = State.settings || {};
  const rules = s.spendDiscountRules;
  if(!Array.isArray(rules)) return [];
  const now = Date.now();
  return rules.filter(r => {
    if(!r || !r.active) return false;
    if(r.startDate && r.endDate){
      const start = parseSaleTime(r.startDate, r.startTime || '00:00');
      const end = parseSaleTime(r.endDate, r.endTime || '23:59');
      if(now < start || now >= end) return false;
    }
    return true;
  });
}

function calcQualifyingAmount(rule, cartItems){
  // Returns the total that counts toward the threshold based on rule.scope
  if(rule.scope === 'store') return cartItems.reduce((s, c) => {
    const p = State.products[c.id];
    return s + (p ? effPrice(p) * c.qty : 0);
  }, 0);
  if(rule.scope === 'category'){
    const cat = rule.category;
    return cartItems.reduce((s, c) => {
      const p = State.products[c.id];
      if(p && p.category === cat) return s + effPrice(p) * c.qty;
      return s;
    }, 0);
  }
  if(rule.scope === 'product' && Array.isArray(rule.productIds)){
    return cartItems.reduce((s, c) => {
      if(rule.productIds.includes(c.id)){
        const p = State.products[c.id];
        return s + (p ? effPrice(p) * c.qty : 0);
      }
      return s;
    }, 0);
  }
  return 0;
}

function calcDiscountTargetAmount(rule, cartItems){
  // Returns the actual discount PKR based on discountTarget scope
  const fullDiscount = Number(rule.discountAmount || 0);
  if(!fullDiscount) return 0;
  const target = rule.discountTarget || 'store';
  if(target === 'store') return fullDiscount;
  // For category/product targets, scale proportionally to the target's share of itemTotal
  let targetSubtotal = 0;
  if(target === 'category' && rule.discountCategory){
    cartItems.forEach(c => {
      const p = State.products[c.id];
      if(p && p.category === rule.discountCategory) targetSubtotal += effPrice(p) * c.qty;
    });
  } else if(target === 'product' && Array.isArray(rule.discountProductIds)){
    cartItems.forEach(c => {
      if(rule.discountProductIds.includes(c.id)){
        const p = State.products[c.id];
        targetSubtotal += p ? effPrice(p) * c.qty : 0;
      }
    });
  }
  if(targetSubtotal <= 0) return 0;
  // Calculate what portion of the itemTotal the target represents
  let itemTotal = 0;
  cartItems.forEach(c => { const p = State.products[c.id]; if(p) itemTotal += effPrice(p) * c.qty; });
  if(itemTotal <= 0) return 0;
  const scaled = fullDiscount * (targetSubtotal / itemTotal);
  // Cap discount so it never exceeds the target subtotal
  return Math.min(Math.round(scaled), Math.round(targetSubtotal));
}

function calcSpendDiscount(cartItems){
  // Returns { amount: number, rule: object|null } (best) or { amount: number, rules: object[] } (stack)
  const stacking = (State.settings?.spendDiscountStacking) || 'best';
  const rules = spendDiscountRules();
  if(!rules.length || !cartItems.length) return { amount: 0, rule: null, rules: [] };
  const applicable = [];
  for(const rule of rules){
    const qual = calcQualifyingAmount(rule, cartItems);
    if(qual >= Number(rule.minSpend || 0)){
      applicable.push({ rule, amount: calcDiscountTargetAmount(rule, cartItems) });
    }
  }
  if(!applicable.length) return { amount: 0, rule: null, rules: [] };
  if(stacking === 'stack'){
    const total = applicable.reduce((s, r) => s + r.amount, 0);
    return { amount: Math.min(total, Math.round(cartItems.reduce((s,c) => { const p = State.products[c.id]; return s + (p ? effPrice(p) * c.qty : 0); }, 0))), rule: null, rules: applicable.map(r => r.rule) };
  }
  // best mode
  applicable.sort((a, b) => b.amount - a.amount);
  return { amount: applicable[0].amount, rule: applicable[0].rule, rules: [applicable[0].rule] };
}

function calcSpendDiscountProgress(cartItems){
  const rules = spendDiscountRules();
  if(!rules.length || !cartItems.length) return null;
  let closest = null, closestGap = Infinity;
  for(const rule of rules){
    const qual = calcQualifyingAmount(rule, cartItems);
    const gap = Number(rule.minSpend || 0) - qual;
    if(gap > 0 && gap < closestGap){ closest = rule; closestGap = gap; }
  }
  if(closest && closestGap <= 5000){
    return {
      remaining: Math.ceil(closestGap),
      minSpend: closest.minSpend,
      name: closest.name,
      discount: closest.discountAmount,
      scope: closest.scope,
      category: closest.scope === 'category' ? closest.category : null,
      productIds: closest.scope === 'product' ? closest.productIds : null,
      discountTarget: closest.discountTarget
    };
  }
  return null;
}

function spendDiscountTargetLabel(rule){
  // Human-readable description of what the discount applies to
  if(!rule) return '';
  if(rule.discountTarget === 'store' || !rule.discountTarget) return 'Entire order';
  if(rule.discountTarget === 'category') return escapeHtml(rule.discountCategory || 'Category');
  if(rule.discountTarget === 'product' && rule.discountProductIds?.length){
    const names = rule.discountProductIds.map(id => State.products[id]?.name || id).filter(Boolean);
    return names.length ? escapeHtml(names.join(', ')) : 'Selected products';
  }
  return 'Selected products';
}

function spendDiscountScopeLabel(rule){
  if(!rule) return '';
  if(rule.scope === 'store') return 'Entire store';
  if(rule.scope === 'category') return escapeHtml(rule.category || 'Category');
  if(rule.scope === 'product' && rule.productIds?.length){
    const names = rule.productIds.map(id => State.products[id]?.name || id).filter(Boolean);
    return names.length ? escapeHtml(names.join(', ')) : 'Selected products';
  }
  return '';
}

function spendDiscountLabel(rule){
  return `Spend PKR ${Number(rule.minSpend).toLocaleString()} → Get PKR ${Number(rule.discountAmount).toLocaleString()} off`;
}

function cartHasSpendDiscountProgress(cartItems){
  return calcSpendDiscountProgress(cartItems || State.cart) !== null;
}
function spendDiscountProgressText(cartItems){
  const prog = calcSpendDiscountProgress(cartItems || State.cart);
  if(!prog) return '';
  const scopeWord = prog.scope === 'store' ? 'any items' : prog.scope === 'category' ? (prog.category || 'this category') : 'selected items';
  return `Spend PKR ${prog.remaining.toLocaleString()} more on ${escapeHtml(scopeWord)} to unlock PKR ${prog.discount.toLocaleString()} off`;
}
function saleTick(){
  const st = saleState();
  if(_lastSaleState !== st && _lastSaleState !== null){ _lastSaleState = st; render(); }
  else _lastSaleState = st;
  document.querySelectorAll('[data-countdown]').forEach(el=>{ el.textContent = countdownText(); });
  document.querySelectorAll('[data-countdown-admin]').forEach(el=>{ el.textContent = st==='active' ? countdownText() : (st==='upcoming' ? 'Starts '+countdownText() : '—'); });
}

function emptyProductsMsg(){
  return `<div class="text-center py-10 md:py-16 text-gray-400">

}

function productCard(id,p){
  const rating = avgRating(p);
  return `
  <a href="#product/${id}" class="card-hover bg-white rounded-2xl overflow-hidden shadow-sm border border-[#F0E8DC] block">
    <div class="aspect-square overflow-hidden bg-cream2 relative">
      <img src="${p.image||'https://via.placeholder.com/400x400?text=Gbyrish'}" class="prod-img w-full h-full object-cover">
      ${Number(p.stock)<=0 ? '<span class="absolute top-2 left-2 bg-red-500 text-white text-[10px] px-2 py-1 rounded-full">Sold Out</span>' : (isDeal(p) && p.badge ? dealBadgeHtml(p) : (Number(p.stock)<10 ? `<span class="absolute top-2 left-2 bg-amber-500 text-white text-[10px] px-2 py-1 rounded-full">Only ${p.stock} left</span>` : ''))}
      ${isDeal(p) && dealDiscountPercent(p)>0 ? `<span class="absolute top-2 right-2 bg-red-500 text-white text-[10px] px-2 py-1 rounded-full font-semibold">-${dealDiscountPercent(p)}%</span>` : (Number(p.discountPercent||0)>0 ? `<span class="absolute top-2 right-2 bg-red-500 text-white text-[10px] px-2 py-1 rounded-full font-semibold">-${p.discountPercent}%</span>` : (saleState()==='active' && salePercent()>0 ? `<span class="absolute top-2 right-2 bg-red-500 text-white text-[10px] px-2 py-1 rounded-full font-semibold">-${salePercent()}%</span>` : ''))}
    </div>
    <div class="p-3 md:p-4">
      <p class="text-[10px] uppercase tracking-wide text-accentDark mb-1">${escapeHtml(p.category||'')}</p>
      <h3 class="font-medium text-sm md:text-base line-clamp-1 break-words">${escapeHtml(p.name)}</h3>
      ${isDeal(p) ? dealIncludedItemsHtml(p, false) : `<div class="flex items-center gap-1 my-1 text-xs text-amber-500">${starString(rating)} <span class="text-gray-400">(${(p.reviews?Object.keys(p.reviews).length:0)})</span></div>`}
      <p class="mt-1 leading-tight">${priceHtml(p)}</p>
      ${(isDeal(p) && dealSavings(p)>0) || Number(p.discountPercent||0)>0 ? `<p class="text-[11px] text-green-600 font-medium mt-0.5">Save ${money(Number(p.price||0) - effPrice(p))}</p>` : ''}
    </div>
  </a>`;
}
function avgRating(p){
  if(!p.reviews) return 0;
  const arr = Object.values(p.reviews);
  if(!arr.length) return 0;
  return arr.reduce((a,r)=>a+Number(r.rating||0),0)/arr.length;
}
function starString(rating){
  let s='';
  for(let i=1;i<=5;i++) s += i<=Math.round(rating) ? '&#9733;' : '&#9734;';
  return s;
}

/* ---------------- Page: Shop ---------------- */
function parseQuery(route){
  const q = route.split('?')[1];
  const params = {};
  if(q) q.split('&').forEach(pair=>{ const [k,v]=pair.split('='); params[k]=decodeURIComponent(v||''); });
  return params;
}
function pageShop(){
  const params = parseQuery(State.route);
  const activeCat = params.cat || 'All';
  const cats = ['All', ...CATEGORIES];
  let list = Object.entries(State.products).filter(([id,p]) => Number(p.stock||0) > 0);
  if(activeCat!=='All') list = list.filter(([id,p]) => p.category===activeCat);
  return `
  <div class="max-w-7xl mx-auto px-4 md:px-8 py-5 md:py-12">
    <h1 class="font-serif text-xl md:text-4xl mb-1 md:mb-2">Shop ${activeCat!=='All'? '- '+escapeHtml(activeCat):'All Products'}</h1>
    <p class="text-gray-500 text-sm md:text-base mb-4 md:mb-8">${list.length} product${list.length!==1?'s':''} found</p>
    <div class="flex gap-8">
      <aside class="hidden md:block w-56 shrink-0">
        <h3 class="font-medium mb-3 text-sm uppercase tracking-wide text-gray-500">Categories</h3>
        <div class="flex flex-col gap-2">

      </aside>
      <div class="flex-1">
        <div class="flex md:hidden gap-1.5 overflow-x-auto hide-scrollbar pb-3 mb-1">
          ${cats.map(c=>`<a href="${c==='All'?'#shopall':(CAT_HASH[c]||'#shop?cat='+encodeURIComponent(c))}" class="shrink-0 px-3 py-1.5 rounded-full text-[11px] font-medium border ${activeCat===c ? 'bg-primary text-white border-primary' : 'border-gray-200'}">${c}</a>`).join('')}

function customizationFormHtml(category){
  const fields = CUSTOM_FIELDS[category] || [];
  if(!fields.length) return '';
  return `
  <div class="mb-5 bg-cream2 rounded-xl p-4">
    <p class="text-sm font-medium mb-3">Customize This ${escapeHtml(category)}</p>
    <div class="space-y-3">
      ${fields.map(f=>`
        <div>
          <label class="text-xs font-medium block mb-1">${escapeHtml(f.label)}${f.required?' *':' (optional)'}</label>
          <input id="custom-field-${f.name}" data-required="${f.required?'1':'0'}" data-label="${escapeHtml(f.label)}" placeholder="${escapeHtml(f.placeholder)}" class="w-full border border-gray-200 rounded-xl px-3 py-2.5 text-sm bg-white">
        </div>`).join('')}
    </div>
  </div>`;
}
let currentProductImages = [];
let currentProductImageIndex = 0;
function updateProductImageDisplay(){
  const mainImg = document.getElementById('main-prod-img');
  if(mainImg) mainImg.src = currentProductImages[currentProductImageIndex] || '';
  const counter = document.getElementById('prod-img-counter');
  if(counter) counter.textContent = (currentProductImageIndex+1) + '/' + currentProductImages.length;
  document.querySelectorAll('.thumb-img').forEach((el,i)=>{
    el.classList.toggle('border-primary', i===currentProductImageIndex);
    el.classList.toggle('border-transparent', i!==currentProductImageIndex);
  });
}
window.setProductImage = function(i){
  currentProductImageIndex = i;
  updateProductImageDisplay();
};
window.changeProductImage = function(dir){
  if(!currentProductImages.length) return;
  currentProductImageIndex = (currentProductImageIndex + dir + currentProductImages.length) % currentProductImages.length;
  updateProductImageDisplay();
};
let detailQty = 1;
window.changeDetailQty = function(d){
  detailQty = Math.max(1, detailQty+d);
  const a=document.getElementById('detail-qty'), b=document.getElementById('detail-qty-m');
  if(a) a.textContent=detailQty; if(b) b.textContent=detailQty;
};
window.addToCartFromDetail = function(id){
  const p = State.products[id];
  const fields = CUSTOM_FIELDS[p?.category] || [];
  let opts = {};
  if(fields.length){
    for(const f of fields){
      const el = document.getElementById('custom-field-'+f.name);
      const val = el ? el.value.trim() : '';
      if(f.required && !val){ toast('Please fill in "'+f.label+'" to customize this item','err'); el?.focus(); return; }
      if(val) opts[f.name] = val;
    }
  } else {
    const note = document.getElementById('custom-note')?.value || '';
    if(note) opts.note = note;
  }
  addToCart(id, detailQty, opts);
  detailQty = 1;
};
function reviewForm(id){
  return `
  <form onsubmit="event.preventDefault(); window.submitReview('${id}', this)" class="bg-cream2 rounded-2xl p-5">
    <p class="text-sm font-medium mb-2">Your Rating</p>
    <div id="star-input" class="flex gap-1 mb-3 text-2xl text-amber-400">
      ${[1,2,3,4,5].map(i=>`<span class="star" data-val="${i}" onclick="window.setStarRating(${i})">&#9734;</span>`).join('')}
    </div>
    <input type="hidden" name="rating" id="rating-value" value="5">
    <textarea name="text" required placeholder="Share your experience with this product..." class="w-full border border-gray-200 rounded-xl p-3 text-sm mb-3" rows="3"></textarea>
    <button class="btn-primary px-6 py-2.5 rounded-xl text-sm font-medium">Submit Review</button>
  </form>`;
}
window.setStarRating = function(v){
  document.getElementById('rating-value').value = v;
  document.querySelectorAll('#star-input .star').forEach(s=>{
    s.innerHTML = Number(s.dataset.val) <= v ? '&#9733;' : '&#9734;';
  });
};
window.submitReview = function(id, form){
  if(!requireFirebase()) return;
  const rating = document.getElementById('rating-value').value;
  const text = form.text.value;
  if(!rating){ toast('Please select a star rating','err'); return; }
  const reviewId = doc(collection(db, 'products')).id;
  updateDoc(doc(db, 'products', id), {
    [`reviews.${reviewId}`]: {
      name: State.user.displayName || State.user.email.split('@')[0],
      rating: Number(rating),
      text,
      uid: State.user.uid,
      date: Date.now()
    }
  }).then(()=>{ toast('Review submitted, thank you!'); form.reset(); })
    .catch(err=>{ console.error('Review submit failed:', err); toast('Failed to submit review: ' + err.message, 'err'); });
};

window.applyCoupon = function(){
  const code = document.getElementById('coupon-input').value.trim().toUpperCase();
  if(State.coupons[code]){ State.appliedCoupon = code; toast('Coupon applied: '+code+'% off'); render(); }
  else toast('Invalid coupon code','err');
};
window.placeOrder = async function(form){
  if(!requireFirebase()) return;
  if(cartHasOutOfStock()){ toast('Cart has out-of-stock items. Please review your cart.','err'); return; }
  // Prevent duplicate orders from double-clicks or retries
  if(State._placingOrder){ toast('Order is already being processed...','err'); return; }
  State._placingOrder = true;
  const btn = form.querySelector('button[type=submit], button:not([type])');
  if(btn){ btn.disabled = true; btn.textContent = 'Placing Order...'; }
  const t = cartTotals();
  const orderId = genOrderId();
  const data = new FormData(form);
  const order = {
    orderId,
    uid: State.user.uid,
    customer: {
      name: data.get('fullName'), email: data.get('email'), phone: data.get('phone'),
      country: data.get('country'), province: data.get('province'), city: data.get('city'),
      address: data.get('address'),
      photo: State.user.photoURL || ''
    },
    payment: data.get('payment'),
    items: State.cart.map(c => ({ id: c.id, name: State.products[c.id]?.name, price: State.products[c.id]?.price, qty: c.qty, opts: c.opts })),
    totals: t,
    coupon: State.appliedCoupon || null,
    couponDiscount: t.couponDiscount || 0,
    spendDiscount: t.spendDiscount || 0,
    spendDiscountRule: t.spendDiscountRule ? {
      id: t.spendDiscountRule.id,
      name: t.spendDiscountRule.name,
      minSpend: t.spendDiscountRule.minSpend,
      discountAmount: t.spendDiscountRule.discountAmount,
      scope: t.spendDiscountRule.scope,
      category: t.spendDiscountRule.category || null,
      productIds: t.spendDiscountRule.productIds || null,
      discountTarget: t.spendDiscountRule.discountTarget || 'store',
      discountCategory: t.spendDiscountRule.discountCategory || null,
      discountProductIds: t.spendDiscountRule.discountProductIds || null
    } : null,
    spendDiscountRules: t.spendDiscountRules?.length ? t.spendDiscountRules.map(r => ({
      id: r.id, name: r.name, minSpend: r.minSpend, discountAmount: r.discountAmount,
      scope: r.scope, category: r.category || null, productIds: r.productIds || null,
      discountTarget: r.discountTarget || 'store', discountCategory: r.discountCategory || null,
      discountProductIds: r.discountProductIds || null
    })) : null,
    status: 'Pending',
    createdAt: Date.now(),
    inventoryProcessed: false
  };

  // Step 1: Create the order in Firestore
  try{
    // Final stock re-validation right before committing the order
    for(const c of State.cart){
      const p = State.products[c.id];
      if(!p || Number(p.stock||0) < c.qty){
        toast(`${p ? p.name : 'An item'} no longer has enough stock`, 'err');
        State._placingOrder = false;
        if(btn){ btn.disabled=false; btn.textContent = 'Place Order · ' + money(t.grand); }
        return;
      }
    }
    await withTimeout(setDoc(doc(db, 'orders', orderId), order), 20000, 'Creating order');
  }catch(e){
    console.error('Order creation failed:', e);
    toast('Order failed: could not create order. Please try again.','err');
    State._placingOrder = false;
    if(btn){ btn.disabled=false; btn.textContent = 'Place Order · ' + money(t.grand); }
    return;
  }

  // Step 2: Deduct purchased quantities from inventory (idempotent via inventoryProcessed flag)
  try{
    const orderSnap = await getDoc(doc(db, 'orders', orderId));
    if(!orderSnap.exists() || !orderSnap.data().inventoryProcessed){
      await Promise.all(order.items.map(it => {
        const p = State.products[it.id];
        const newStock = Math.max(0, Number(p?.stock||0) - it.qty);
        return updateDoc(doc(db, 'products', it.id), { stock: newStock });
      }));
      await updateDoc(doc(db, 'orders', orderId), { inventoryProcessed: true });
    }
  }catch(e){
    console.error('Inventory update failed (order was created):', e);
    toast('Order placed but inventory update had an issue. Our team will review it.', 'warn');
  }

  // Step 3: Queue confirmation email (does not affect order success)
  try{
    await addDoc(collection(db, 'mail'), {
      to: order.customer.email,
      orderId,
      customerName: order.customer.name,
      grandTotal: order.totals.grand,
      items: order.items,
      createdAt: Date.now(),
      emailSent: false
    });
  }catch(e){
    console.error('Email queue failed (order was created):', e);
    // Do NOT show an error to the customer — the order exists.
  }

  // Step 4: Clear cart and navigate to confirmation (always runs)
  try {
    State.cart = []; State.appliedCoupon = null; saveCart();
    location.hash = '#order-confirmation/'+orderId;
  } finally {
    State._placingOrder = false;
  }
};

function trackOrderResultHtml(orderId){
  const order = State.orders[orderId];
  if(!order){
    return `<div class="bg-red-50 border border-red-100 text-red-500 rounded-xl p-4 text-sm text-center">No order found with ID "${escapeHtml(orderId)}". Please check the ID and try again.</div>`;
  }
  const steps = ['Pending','Processing','Shipped','Delivered'];
  const currentIdx = order.status==='Cancelled' ? -1 : steps.indexOf(order.status);
  return `
  <div class="bg-white border border-gray-100 rounded-2xl p-6">
    <div class="flex justify-between items-center mb-6">
      <div><p class="font-semibold text-lg">${orderId}</p><p class="text-xs text-gray-400">${new Date(order.createdAt).toLocaleString()}</p></div>

    </div>
    ${order.status!=='Cancelled' ? `
    <div class="flex items-center mb-8">
      ${steps.map((s,i)=>`
        <div class="flex-1 flex flex-col items-center relative">
          <div class="w-8 h-8 rounded-full flex items-center justify-center text-xs font-medium z-10 ${i<=currentIdx ? 'bg-primary text-white' : 'bg-gray-200 text-gray-400'}">${i+1}</div>
          <p class="text-[10px] mt-2 text-center ${i<=currentIdx?'text-primary font-medium':'text-gray-400'}">${s}</p>
          ${i<steps.length-1? `<div class="absolute top-4 left-1/2 w-full h-0.5 ${i<currentIdx?'bg-primary':'bg-gray-200'}"></div>`:''}
        </div>`).join('')}
    </div>` : '<p class="text-sm text-red-500 mb-6">This order has been cancelled.</p>'}
    <div class="space-y-2 border-t border-gray-100 pt-4">
      ${order.items.map(it=>`<div class="flex justify-between text-sm"><span>${escapeHtml(it.name)} x${it.qty}</span><span>${money(it.price*it.qty)}</span></div>`).join('')}

      </div>` : ''}

    </div>
  </div>`;
}

// pendingImages holds the working set of images for the product form:
// existing https:// URLs (already uploaded) plus new data: URLs (freshly
// picked, not uploaded yet). Order is preserved; index 0 becomes the
// product's main image. Re-initialized only when switching to a different
// product (tracked via pendingImagesEditId), so unrelated background
// re-renders (e.g. a new order coming in via onSnapshot) don't wipe out
// photos the admin has already picked but not saved yet.
let pendingImages = [];
let pendingImagesEditId;
function initPendingImagesIfNeeded(editId, editing){
  const key = editId || '__new__';
  if(pendingImagesEditId !== key){
    pendingImages = editing ? (editing.images && editing.images.length ? [...editing.images] : (editing.image ? [editing.image] : [])) : [];
    pendingImagesEditId = key;
  }
}
function imagePreviewGridHtml(){
  return pendingImages.map((src,i)=>`
    <div class="relative w-24 h-24">
      <img src="${src}" class="w-24 h-24 object-cover rounded-xl border border-gray-200">
      <button type="button" onclick="window.removePendingImage(${i})" class="absolute -top-2 -right-2 bg-red-500 text-white rounded-full w-6 h-6 flex items-center justify-center text-xs shadow">✕</button>
      ${i===0 ? '<span class="absolute bottom-1 left-1 bg-black/60 text-white text-[10px] px-1.5 py-0.5 rounded">Main</span>' : ''}
    </div>`).join('');
}
function renderImagePreviewGrid(){
  const grid = document.getElementById('image-preview-grid');
  if(!grid) return;
  grid.innerHTML = imagePreviewGridHtml();
}
window.toggleDealFields = function(category){
  const box = document.getElementById('deal-fields');
  if(box) box.classList.toggle('hidden', category !== 'Deals');
};
window.removePendingImage = function(i){
  pendingImages.splice(i,1);
  renderImagePreviewGrid();
};
window.previewImages = async function(e){
  const files = Array.from(e.target.files || []);
  if(!files.length) return;
  for(const file of files){
    try{
      const compressed = await compressImage(file);
      pendingImages.push(compressed);
      renderImagePreviewGrid();
    }catch(err){
      console.error('Failed to process image', file.name, err);
      toast('Could not read image: '+file.name,'err');
    }
  }
  e.target.value = ''; // allow re-selecting the same file / adding more
};
window.saveProduct = async function(form, editId){
  if(!requireFirebase()) return;
  const btn = document.getElementById('save-product-btn');
  btn.disabled = true; btn.textContent = 'Saving...';
  const data = new FormData(form);
  const id = editId || doc(collection(db,'products')).id;
  try{
    // Upload any brand-new (data:) images; keep already-hosted (https:) ones as-is.
    const finalImages = [];
    for(let i=0;i<pendingImages.length;i++){
      const src = pendingImages[i];
      if(src.startsWith('data:')){
        btn.textContent = `Uploading photo ${i+1}/${pendingImages.length}...`;
        const url = await uploadProductImage(src, id);
        finalImages.push(url);
      } else {
        finalImages.push(src);
      }
    }
    btn.textContent = 'Saving...';
    const category = data.get('category');
    const isDealCategory = category === 'Deals';
    const includedItems = isDealCategory ? String(data.get('includedItems')||'').split('\n').map(s=>s.trim()).filter(Boolean) : null;
    const originalPriceRaw = data.get('originalPrice');
    const product = {
      name: data.get('name'),
      category: category,
      price: Number(data.get('price')),
      stock: Number(data.get('stock')),
      customizable: !!data.get('customizable'),
      description: data.get('description'),
      image: finalImages[0] || '',
      images: finalImages,
      reviews: (editId && State.products[editId]?.reviews) || null,
      createdAt: (editId && State.products[editId]?.createdAt) || Date.now(),
      slug: id,
      originalPrice: (isDealCategory && originalPriceRaw) ? Number(originalPriceRaw) : null,
      includedItems: (includedItems && includedItems.length) ? includedItems : null,
      badge: isDealCategory ? (data.get('badge') || null) : null,
      featured: isDealCategory ? !!data.get('featured') : false,
      discountPercent: Number(data.get('discountPercent')||0)
    };
    await withTimeout(setDoc(doc(db, 'products', id), product), 20000, 'Saving product');
    pendingImages = [];
    pendingImagesEditId = undefined;
    toast(editId? 'Product updated!' : 'Product published! Live on shop page.');
    location.hash = '#product/'+id;
  }catch(err){
    console.error('Error saving product:', err);
    toast('Error saving product: '+err.message,'err');
  }finally{
    btn.disabled=false; btn.textContent = editId? 'Update Product':'Publish Product';
  }
};

window.saveDiscountRule = async function(form){
  if(!requireFirebase()) return;
  const scope = form.scope.value;
  const discountTarget = form.discountTarget?.value || 'store';
  const minSpend = Number(form.minSpend.value);
  const discountAmount = Number(form.discountAmount.value);
  if(minSpend <= 0){ toast('Minimum spend must be greater than 0','err'); return; }
  if(discountAmount <= 0){ toast('Discount amount must be greater than 0','err'); return; }
  if(discountAmount >= minSpend){ toast('Discount amount must be less than the minimum spend','err'); return; }
  if(scope === 'category' && !form.category.value){ toast('Please select a qualifying category','err'); return; }
  if(scope === 'product'){
    const checked = form.querySelectorAll('.discount-product-cb:checked');
    if(checked.length === 0){ toast('Please select at least one qualifying product','err'); return; }
  }
  if(discountTarget === 'category' && !form.discountCategory.value){ toast('Please select a discount target category','err'); return; }
  if(discountTarget === 'product'){
    const checked = form.querySelectorAll('.discount-target-product-cb:checked');
    if(checked.length === 0){ toast('Please select at least one discount target product','err'); return; }
  }

  const btn = document.getElementById('discount-form-btn');
  btn.disabled = true; btn.textContent = 'Saving...';
  try{
    const ruleId = form.ruleId.value || doc(collection(db,'temp')).id;
    const isEdit = !!form.ruleId.value;
    const rule = {
      id: ruleId,
      name: form.name.value.trim(),
      minSpend,
      discountAmount,
      scope,
      category: scope === 'category' ? form.category.value : null,
      productIds: scope === 'product' ? Array.from(form.querySelectorAll('.discount-product-cb:checked')).map(cb=>cb.value) : null,
      discountTarget,
      discountCategory: discountTarget === 'category' ? form.discountCategory.value : null,
      discountProductIds: discountTarget === 'product' ? Array.from(form.querySelectorAll('.discount-target-product-cb:checked')).map(cb=>cb.value) : null,
      active: true,
      startDate: form.startDate.value || null,
      startTime: form.startTime.value || null,
      endDate: form.endDate.value || null,
      endTime: form.endTime.value || null
    };

    const currentRules = Array.isArray(State.settings?.spendDiscountRules) ? [...State.settings.spendDiscountRules] : [];
    if(isEdit){
      const idx = currentRules.findIndex(r => r.id === ruleId);
      if(idx >= 0) currentRules[idx] = rule;
      else currentRules.push(rule);
    } else {
      currentRules.push(rule);
    }

    await withTimeout(setDoc(doc(db, 'settings', 'site'), { spendDiscountRules: currentRules }, { merge: true }), 15000, 'Saving discount rule');
    toast(isEdit ? 'Rule updated!' : 'Rule created!');
    window.resetDiscountForm();
  }catch(err){
    toast('Error saving rule: '+err.message,'err');
  }finally{
    btn.disabled = false; btn.textContent = isEdit ? 'Update Rule' : 'Create Rule';
  }
};
window.editDiscountRule = function(id){
  const rule = (State.settings?.spendDiscountRules || []).find(r => r.id === id);
  if(!rule){ toast('Rule not found','err'); return; }
  if(typeof window.populateDiscountProductLists === 'function') window.populateDiscountProductLists();
  const form = document.getElementById('discount-rule-form');
  form.ruleId.value = rule.id;
  form.name.value = rule.name || '';
  form.minSpend.value = rule.minSpend || '';
  form.discountAmount.value = rule.discountAmount || '';
  form.scope.value = rule.scope || 'store';
  if(rule.scope === 'category') form.category.value = rule.category || '';
  if(rule.scope === 'product' && rule.productIds){
    setTimeout(() => {
      form.querySelectorAll('.discount-product-cb').forEach(cb => {
        cb.checked = rule.productIds.includes(cb.value);
      });
    }, 60);
  }
  form.discountTarget.value = rule.discountTarget || 'store';
  if(rule.discountTarget === 'category') form.discountCategory.value = rule.discountCategory || '';
  if(rule.discountTarget === 'product' && rule.discountProductIds){
    setTimeout(() => {
      form.querySelectorAll('.discount-target-product-cb').forEach(cb => {
        cb.checked = rule.discountProductIds.includes(cb.value);
      });
    }, 60);
  }
  form.startDate.value = rule.startDate || '';
  form.startTime.value = rule.startTime || '00:00';
  form.endDate.value = rule.endDate || '';
  form.endTime.value = rule.endTime || '23:59';
  document.getElementById('discount-form-title').textContent = 'Edit Discount Rule';
  document.getElementById('discount-form-btn').textContent = 'Update Rule';
  document.getElementById('discount-form-cancel').style.display = '';
  window.toggleDiscountFields();
  form.scrollIntoView({ behavior:'smooth', block:'start' });
};
window.toggleDiscountRule = async function(id){
  if(!requireFirebase()) return;
  const currentRules = Array.isArray(State.settings?.spendDiscountRules) ? [...State.settings.spendDiscountRules] : [];
  const rule = currentRules.find(r => r.id === id);

  rule.active = !rule.active;

/* ---------------- Main Render ---------------- */
let _renderScheduled = false;
function render(){
  // Coalesce bursts of render() calls (e.g. auth + products + orders all
  // resolving around the same time) into a single DOM rebuild so the page
  // doesn't repeatedly restart its fade-in animation / reload all images.
  if(_renderScheduled) return;
  _renderScheduled = true;
  // Use a microtask instead of requestAnimationFrame: rAF gets paused/throttled
  // by browsers when the tab/iframe isn't visible yet, which was causing a
  // blank screen on first load in some embedded/preview contexts.
  Promise.resolve().then(()=>{ _renderScheduled = false; doRender(); });
}
function doRender(){
  const root = document.getElementById('app-root');
  const route = State.route;
  try{
    let body = '';
    if(route.startsWith('#product/')) body = pageProduct(route.split('/')[1]);
    else if(route.startsWith('#order-confirmation/')) body = pageOrderConfirmation(route.split('/')[1]);
    else if(route.startsWith('#track-order/')) body = pageTrackOrder(route.split('/')[1]);
    else if(route==='#track-order') body = pageTrackOrder(null);
    else if(route.startsWith('#admin/product/')) body = pageAdminProduct(route.split('/')[2]);
    else if(route==='#admin/sale') body = pageAdminSale();
    else if(route==='#admin/discounts') body = pageAdminDiscounts();
    else if(route==='#admin/product') body = pageAdminProduct(null);
    else if(route==='#admin/inventory') body = pageAdminInventory();
    else if(route==='#admin/orders') body = pageAdminOrders();
    else if(route==='#admin/settings') body = pageAdminSettings();
    else if(route==='#admin') body = pageAdminDash();
    else if(route.startsWith('#shop')) body = pageShop();
    else if(route==='#checkout') body = pageCheckout();
    else if(route.startsWith('#profile')) body = pageProfile();
    else if(route==='#orders') body = pageProfile();
    else body = pageHome();

    root.innerHTML = `
      ${saleTopBar()}
      ${Header()}
      ${MobileMenu()}
      <main class="page active min-h-[60vh]">${body}</main>
      ${Footer()}
      ${BottomNav()}
      <div id="cart-drawer-root">${CartDrawer()}</div>
      ${SearchOverlay()}
    `;
    positionHeaderForSaleBar();
    if(route === '#admin/discounts'){
      setTimeout(() => { if(typeof window.populateDiscountProductLists === 'function') window.populateDiscountProductLists(); }, 50);
    }
  }catch(err){
    console.error('Render error:', err);
    root.innerHTML = `
      <div class="min-h-screen flex items-center justify-center p-6 text-center bg-cream">
        <div class="max-w-md">
          <h1 class="font-serif text-2xl text-primary mb-3">gbyrish</h1>
          <p class="text-red-500 font-medium mb-2">Something went wrong while loading this page.</p>
          <p class="text-xs text-gray-400 mb-6">${escapeHtml(err.message||String(err))}</p>
          <a href="#home" onclick="location.reload()" class="btn-primary inline-block px-6 py-3 rounded-xl font-medium">Reload Home</a>
        </div>
      </div>`;
  }
}

render();
</script>
